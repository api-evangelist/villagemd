aid: villagemd
name: VillageMD
description: 'VillageMD is a Chicago-based, value-based primary care organization that
  operates and supports physician practices across the United States through its Village
  Medical, Village Medical at Home, Summit Health, CityMD and Starling Physicians
  operating companies, serving millions of patients across primary care, multispecialty
  and urgent care. It runs clinics — free-standing practices, in-Walgreens practices,
  home-based care and virtual visits — rather than selling software, and its clinical
  record and patient-facing digital surface run on athenahealth: patient portals are
  hosted at practice-specific athenahealth portal subdomains and the Village Medical
  mobile app is the athenaPatient experience. VillageMD publishes no developer portal,
  no API documentation, no machine-readable specification and no SDK; the only public
  machine-readable interfaces touching its patients are athenahealth''s certified FHIR
  R4 APIs, which are operated and documented by athenahealth, not by VillageMD. Since
  Sycamore Partners took Walgreens Boots Alliance private in August 2025, VillageMD
  has operated as a standalone company in that portfolio.'
